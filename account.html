<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOSJES - Sign In</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/account.css" />
</head>
<body class="page page--lobby">
  <div class="bg-noise" aria-hidden="true"></div>
  <main class="lobby-shell">
    <header class="lobby-header">
      <p class="lobby-kicker">EIGHTYTWENTY CARDGAME</p>
      <h1>MOSJES</h1>
      <p>Sign in to save your decks, or play as a guest.</p>
    </header>

    <section class="lobby-panel auth-panel">

      <!-- Tab switcher -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" data-tab="signin" role="tab" aria-selected="true">Sign In</button>
        <button class="auth-tab" data-tab="register" role="tab" aria-selected="false">Register</button>
      </div>

      <!-- Sign In form -->
      <form id="form-signin" class="lobby-form auth-form" data-tab-content="signin" novalidate>
        <label for="signin-email">Email</label>
        <input id="signin-email" type="email" autocomplete="email" placeholder="you@example.com" required />

        <label for="signin-password">Password</label>
        <input id="signin-password" type="password" autocomplete="current-password" placeholder="••••••••" required />

        <p id="signin-error" class="auth-error" hidden></p>
        <button type="submit" class="btn-primary" id="btn-signin">Sign In</button>

        <button type="button" class="btn-google" id="btn-google-signin">
          <img src="assets/google-icon.svg" alt="" width="18" height="18" />
          Continue with Google
        </button>
      </form>

      <!-- Register form -->
      <form id="form-register" class="lobby-form auth-form" data-tab-content="register" hidden novalidate>
        <label for="reg-name">Display Name</label>
        <input id="reg-name" type="text" maxlength="18" autocomplete="nickname" placeholder="e.g. Gandoe" required />

        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" placeholder="you@example.com" required />

        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" autocomplete="new-password" placeholder="Min. 6 characters" required />

        <p id="register-error" class="auth-error" hidden></p>
        <button type="submit" class="btn-primary" id="btn-register">Create Account</button>

        <button type="button" class="btn-google" id="btn-google-register">
          <img src="assets/google-icon.svg" alt="" width="18" height="18" />
          Continue with Google
        </button>
      </form>

      <!-- Guest divider -->
      <div class="auth-divider">
        <span>or</span>
      </div>

      <button type="button" class="btn-guest" id="btn-guest">
        Play as Guest
        <small>No account needed — starter decks only</small>
      </button>

      <p id="guest-error" class="auth-error" hidden></p>
    </section>
  </main>

  <script type="module" src="src/account.js"></script>
</body>
</html>
