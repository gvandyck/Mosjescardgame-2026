<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mosjes - Smallest / biggest content per card type</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/cards.css" />
  <link rel="stylesheet" href="styles/card-v1.css" />
  <link rel="stylesheet" href="styles/card-tiers.css" />
  <link rel="stylesheet" href="styles/card-tiers-fullart.css" />
  <link rel="stylesheet" href="styles/card-tiers-boxed.css" />
  <link rel="stylesheet" href="styles/card-tiers-foil.css" />
  <link rel="stylesheet" href="styles/board.css" />
  <style>
    html, body { height: auto !important; min-height: 0 !important; overflow: auto !important; }
    body { padding: 24px; background: #0a0e1a; color: #ddd; font-family: 'DM Sans', sans-serif; }
    h1 { color: #e8b94f; margin: 0 0 8px; }
    .grid { display: grid; grid-template-columns: 150px repeat(2, max-content); gap: 18px 24px; align-items: start; }
    .head, .lbl { font-weight: 700; color: #e8b94f; white-space: pre-line; }
    .pop .card.card-v1--full { --cv1-w: 330px; }
    .hand .card.card-v1--full { --cv1-w: 150px; }
    .field .card.card-v1--field { position: relative; }
    .hand-strip-sim { display: block; }
  </style>
</head>
<body>
  <h1>Smallest and biggest content per card type</h1>
  <p>Columns: pop-up size, hand size, field tile. Rows: the shortest and longest text for each type. Add <code>?tier=1..4</code> to force a tier, <code>?zoom=1</code> for true size (default 2x).</p>
  <div id="grid" class="grid"></div>
  <script type="module">
    import { ALL_CARDS } from './src/data/cardIndex.js';
    import { renderCard } from './src/ui/cardRenderer.js';
    const zoom = Number(new URLSearchParams(location.search).get('zoom')) || 2;
    const tier = Number(new URLSearchParams(location.search).get('tier')) || 0;
    const pairs = [
      ['Mosje short', 'mosje_hacker'], ['Mosje long', 'mosje_chris_ddr'],
      ['Piecie short', 'piecie_warm_kannetje_melk'], ['Piecie long', 'piecie_call_of_welloes'],
      ['Snelle short', 'snelle_momentum_rush'], ['Snelle long', 'snelle_lucky_coin'],
      ['Place short', 'place_delluft'], ['Place long', 'place_the_gym'],
    ];
    const grid = document.getElementById('grid');
    for (const h of ['', 'Hand (real size)', 'Field tile (real size)']) { const d = document.createElement('div'); d.className = 'head'; d.textContent = h; grid.append(d); }
    for (const [label, id] of pairs) {
      const c = ALL_CARDS.find((x) => x.id === id);
      if (!c) { console.warn('missing', id); continue; }
      const card = tier ? { ...c, rarity: '★'.repeat(tier) } : c;
      const l = document.createElement('div'); l.className = 'lbl'; l.textContent = `${label}\n${c.name}\n${c.rarity || ''}`; grid.append(l);
      const piecieLike = c.cardType !== 'MOSJE' && c.type !== 'MOSJE';
      for (const [cls, opts] of [['hand-strip', {}], ['field', { fieldMode: true }]]) {
        const cell = document.createElement('div'); cell.className = cls + (cls === 'field' && piecieLike ? ' board-zone__piecies' : ''); cell.style.zoom = zoom;
        const el = renderCard(card, opts);
        if (cls === 'hand-strip') { el.classList.add('hand-card'); const w = document.createElement('div'); w.className = 'hand-card-wrap'; w.append(el); cell.append(w); } else cell.append(el);
        grid.append(cell);
      }
    }
  </script>
</body>
</html>
