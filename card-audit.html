<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosjes - Card audit (every card)</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/cards.css" />
  <link rel="stylesheet" href="styles/card-v1.css" />
  <link rel="stylesheet" href="styles/card-tiers.css" />
  <link rel="stylesheet" href="styles/card-tiers-fullart.css" />
  <link rel="stylesheet" href="styles/card-tiers-boxed.css" />
  <link rel="stylesheet" href="styles/card-tiers-foil.css" />
  <style>
    html, body { height: auto !important; min-height: 0 !important; overflow: auto !important; }
    body { padding: 24px; background: #0a0e1a; color: #ddd; font-family: 'DM Sans', sans-serif; }
    h1 { color: #e8b94f; margin: 0 0 8px; }
    h2 { color: #e8b94f; margin: 32px 0 12px; border-bottom: 1px solid #2a3350; padding-bottom: 6px; }
    .controls { position: sticky; top: 0; z-index: 50; background: #0a0e1af0; padding: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .controls button { padding: 6px 12px; cursor: pointer; }
    .controls button.active { background: #e8b94f; color: #000; }
    .grid { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
    .cell { display: flex; flex-direction: column; gap: 6px; width: var(--cell-w, 300px); }
    .cell .label { font-size: 12px; color: #aab; word-break: break-word; }
    .cell.bad .label { color: #ff7b7b; font-weight: 700; }
    .cell .card.card-v1--full { --cv1-w: var(--cell-w, 300px); }
    #problems { background: #2a1010; border: 1px solid #7a2a2a; padding: 8px 14px; margin: 10px 0; border-radius: 6px; }
    #problems:empty { display: none; }
    #problems li { margin: 2px 0; }
  </style>
</head>
<body>
  <h1>Card audit</h1>
  <p>Every card in the game through the real <code>renderCard</code>, in the tier style. Cards whose text overflows are flagged in red.</p>
  <div class="controls">Size:
    <button data-w="300" class="active">300</button><button data-w="440">440</button><button data-w="220">220</button>
    <span>Type:</span><span id="type-buttons"></span>
    <label><input type="checkbox" id="field-toggle" /> field tiles</label>
  </div>
  <div id="problems"></div>
  <div id="audit-root"></div>
  <script type="module" src="src/ui/cardAudit.js"></script>
</body>
</html>
