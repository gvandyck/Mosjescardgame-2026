<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/icons/obbyhouse.jpg" type="image/jpeg" />
  <title>MOSJES - Lobby</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/board.css" />
  <link rel="stylesheet" href="styles/account.css" />
</head>
<body class="page page--lobby">
  <div class="bg-noise" aria-hidden="true"></div>
  <div id="app-version" class="app-version-badge">Version loading...</div>
  <div id="user-badge" class="user-badge" hidden>
    <span id="user-badge-name"></span>
    <button id="btn-delete-account" class="btn-account-danger">Delete account</button>
    <button id="btn-signout" class="btn-signout">Sign out</button>
  </div>
  <main class="lobby-shell">
    <header class="lobby-header">
      <p class="lobby-kicker">EIGHTYTWENTY CARDGAME</p>
      <h1>MOSJES</h1>
      <p>Build your squad. Pick your deck. Enter the arena.</p>
    </header>

    <section class="lobby-panel">
      <form id="lobby-form" class="lobby-form">
        <label for="player-name">Player Name</label>
        <input id="player-name" name="player-name" type="text" maxlength="18" placeholder="e.g. Gandoe" required />

        <label for="deck-select">Starter Deck</label>
        <select id="deck-select" name="deck-select"></select>

        <div id="active-deck-panel" class="active-deck-panel" hidden>
          <span class="active-deck-panel__label">Active Deck</span>
          <span class="active-deck-panel__name"></span>
          <span class="active-deck-panel__mosjes"></span>
          <button type="button" id="btn-change-deck" class="btn-nav">Change deck</button>
        </div>

        <fieldset class="lobby-mode">
          <legend>Game Mode</legend>
          <label><input type="radio" name="lobby-mode" value="create" checked /> Create Room</label>
          <label><input type="radio" name="lobby-mode" value="join" /> Join Room</label>
        </fieldset>

        <label for="room-code">Room Code (4 digits, join only)</label>
        <input id="room-code" name="room-code" type="text" inputmode="numeric" maxlength="4" placeholder="4827" />

        <div class="lobby-offline">
          <label>
            <input type="checkbox" id="play-offline" name="play-offline" />
            Play Offline vs Bot
          </label>
        </div>

        <button type="submit" class="btn-primary">Enter Game Board</button>

        <div class="lobby-nav-links">
          <a href="./deck-builder.html" class="btn-nav">Build Deck</a>
          <a href="./store.html" class="btn-nav">Store 🪙</a>
          <a href="./leaderboard.html" class="btn-nav">Leaderboard</a>
        </div>

        <div class="lobby-dev-tools">
          <a href="./game.html?botvsbot=true&player=player_1" class="btn-dev-tool">🤖 Bot vs Bot (test)</a>
        </div>
      </form>

      <div id="room-code-display" class="room-code-display" hidden>
        <p>Room created! Share this code with your opponent:</p>
        <strong id="room-code-value" class="room-code-value"></strong>
        <p class="room-code-hint">Navigating to game board...</p>
      </div>
    </section>
  </main>

  <div id="modal-root" class="modal-root"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
