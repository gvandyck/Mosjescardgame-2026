<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOSJES - Game Board</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/board.css" />
  <link rel="stylesheet" href="styles/cards.css" />
</head>
<body class="page page--game">
  <div class="bg-noise" aria-hidden="true"></div>
  <div id="app-version" class="app-version-badge">Version loading...</div>

  <header class="game-topbar">
    <h1>MOSJES Arena</h1>
    <p id="turn-label">Loading turn...</p>
    <div class="topbar-actions">
      <button id="btn-general-quest" class="btn-secondary" type="button">General Quest 🎯</button>
      <button id="btn-personal-quest" class="btn-secondary" type="button">Personal Quest ⭐</button>
      <button id="btn-end-turn" class="btn-primary" type="button">End Turn</button>
    </div>
  </header>

  <main class="game-layout">
    <section class="game-board" id="board-root" aria-label="Game board"></section>

    <aside class="game-log-panel">
      <h2>Battle Log</h2>
      <div id="log-root" class="game-log"></div>
    </aside>

    <section class="game-hand-panel">
      <h2>Your Hand</h2>
      <div id="hand-root" class="hand-strip"></div>
    </section>
  </main>

  <div id="modal-root" class="modal-root"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
