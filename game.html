<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOSJES - Game Board</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/board.css" />
  <link rel="stylesheet" href="styles/cards.css" />
</head>
<body class="page page--game">
  <div class="bg-noise" aria-hidden="true"></div>
  <div id="app-version" class="app-version-badge">Version loading...</div>

  <header class="game-topbar">
    <h1>MOSJES Arena</h1>
    <p id="turn-label">Loading turn...</p>
    <span id="topbar-room-code" class="topbar-room-code" hidden>Room: <strong id="topbar-room-code-value"></strong></span>
    <div class="topbar-flow" id="topbar-flow">
      <div class="topbar-flow__item">Place: <strong id="topbar-place">None</strong></div>
      <div class="topbar-flow__item" id="topbar-place-turns">0 turns active</div>
    </div>
    <div class="topbar-actions">
      <button id="btn-toggle-log" class="btn-secondary" type="button" aria-expanded="false" aria-controls="topbar-log-popover">Battle Log</button>
      <button id="btn-general-quest" class="btn-secondary" type="button">General Quest 🎯</button>
      <button id="btn-personal-quest" class="btn-secondary" type="button">Personal Quest ⭐</button>
      <button id="btn-end-turn" class="btn-primary" type="button">End Turn</button>
    </div>
    <section id="topbar-log-popover" class="topbar-log-popover" hidden>
      <div class="topbar-log-header">
        <h2>Battle Log</h2>
        <button id="btn-copy-log" class="btn-secondary" type="button">Copy Log</button>
      </div>
      <div id="log-root" class="game-log"></div>
      <textarea id="log-copy-buffer" class="log-copy-buffer" readonly aria-label="Battle log plain text"></textarea>
    </section>
  </header>

  <main class="game-layout">
    <section class="game-board" id="board-root" aria-label="Game board"></section>

    <section class="game-hand-panel">
      <div id="hand-root" class="hand-strip"></div>
    </section>
  </main>

  <div id="modal-root" class="modal-root"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
